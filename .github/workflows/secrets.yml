name: Secret scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/gitleaks_8.30.1_checksums.txt"
          grep "  $archive$" gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan full Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts="--all" --redact --no-banner'
